   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172435" transform="translate(226.119062 228.32868)">Omit peer prose;</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172435" transform="translate(213.175312 240.331414)">preserve attachments</text>
   </g>
   <g id="text_9">
