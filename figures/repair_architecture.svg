   </g>
   <g id="text_14">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172435" x="117.72" y="298.26" transform="rotate(-0 117.72 298.26)">Ablation: no defense / input only / output only / both. External attacker note is inserted after its sender's local output policy.</text>
   </g>
  </g>
  <g id="text_15">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #475569" x="7.2" y="355.255725" transform="rotate(-0 7.2 355.255725)">The defenses minimize a text channel for a fixed structured task. This is policy activation, not autonomous defense invention or model training.</text>
